services:
  - type: web
    name: colorforge
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/colorforge run build
    staticPublishPath: artifacts/colorforge/dist/public
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html